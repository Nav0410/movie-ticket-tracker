name: Vishwanath and Sons - ALLU Cinemas Ticket Tracker

on:
  workflow_dispatch:

  # GitHub fallback schedule.
  # GitHub may delay scheduled jobs, so this is not guaranteed exactly every 5 min.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: vishwanath-sons-allu-cinemas-ticket-tracker
  cancel-in-progress: false

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      MOVIE_URL: "https://in.bookmyshow.com/cinemas/hyderabad/allu-cinemas-kokapet/buytickets/ALUC/20260815"
      BMS_MOVIE_URL: "https://in.bookmyshow.com/movies/hyderabad/vishwanath-and-sons/"
      TARGET_DATE: "2026-08-15"

      STATE_FILE: "state/ticket_state.json"
      DEBUG_DIR: "debug"

      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      # ------------------------------------------------------
      # 1. Download repository
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # 2. Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------
      # 3. Install dependencies
      #
      # NO PLAYWRIGHT
      # NO CHROMIUM
      # ------------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------
      # 4. Run ticket checker
      # ------------------------------------------------------

      - name: Check BookMyShow for Vishwanath and Sons
        run: |
          python tracker.py

      # ------------------------------------------------------
      # 5. Upload debug information
      # ------------------------------------------------------

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-tracker-debug-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      # ------------------------------------------------------
      # 6. Save state only if tracker changed it
      # ------------------------------------------------------

      - name: Save ticket state
        if: success()
        run: |
          if [ ! -f state/ticket_state.json ]; then
            echo "No ticket state file created."
            echo "This is normal when tickets have not been detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/ticket_state.json

          if git diff --cached --quiet; then
            echo "Ticket state unchanged."
            exit 0
          fi

          git commit -m "Update Vishwanath and Sons ticket state [skip ci]"

          git pull --rebase origin main
          git push origin HEAD:main
