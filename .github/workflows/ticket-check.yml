name: Vishwanath & Sons Ticket Tracker

on:
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Send only a Telegram test message"
        required: false
        default: false
        type: boolean

  # Fallback only. GitHub scheduled runs can be delayed.
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: vishwanath-sons-ticket-tracker
  cancel-in-progress: false

jobs:
  check-tickets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      MOVIE_URL: "https://www.district.in/movies/vishwanath-and-sons-movie-tickets-in-kurnool-MV216343"
      TARGET_DATE: "2026-08-14"
      STATE_FILE: "state/ticket_state.json"
      DEBUG_DIR: "debug"
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test && 'true' || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright

      - name: Install Chromium for Playwright
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Vishwanath & Sons ticket tracker
        run: |
          python tracker.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-tracker-debug-${{ github.run_number }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Save ticket state
        if: success() && env.TEST_MODE != 'true'
        run: |
          if [ ! -f state/ticket_state.json ]; then
            echo "No state file to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state/ticket_state.json

          if git diff --cached --quiet; then
            echo "Ticket state unchanged."
            exit 0
          fi

          git commit -m "Update Vishwanath & Sons ticket state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
